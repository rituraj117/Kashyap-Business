<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Contact — BrandName</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #f8fafc; --text: #0a0a0a; --card-bg: #ffffff;
            --border: #e2e8f0; --shadow: 0 10px 30px rgba(0,0,0,0.04);
            --primary: #6C63FF; --secondary: #FF6584; --accent: #00D9FF;
            --radius: 24px;
        }
        [data-theme="dark"] { --bg: #0a0a0a; --text: #f8fafc; --card-bg: #1a1a1a; --border: #2a2a2a; --shadow: 0 10px 30px rgba(0,0,0,0.3); }
        body { font-family:"Inter",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; transition:0.3s; }
        .container { max-width:1200px; margin:0 auto; padding:0 24px; }
        a { text-decoration:none; color:inherit; }
        .glass { background:rgba(255,255,255,0.6); backdrop-filter:blur(12px); border:1px solid var(--border); }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 0; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; background: var(--bg); z-index: 100;
        }
        .logo { font-size:28px; font-weight:700; font-family:"Space Grotesk",sans-serif; background:linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .nav { display:flex; gap:32px; align-items:center; }
        .nav a { font-weight:500; color:var(--text); position:relative; }
        .nav a::after { content:""; position:absolute; bottom:-4px; left:0; width:0; height:2px; background:var(--primary); transition:0.3s; }
        .nav a:hover::after { width:100%; }
        .btn-primary { background:var(--primary); color:#fff; padding:10px 24px; border-radius:40px; font-weight:600; border:none; cursor:pointer; transition:0.3s; }
        .btn-primary:hover { transform:scale(1.04); box-shadow:0 8px 24px var(--primary); }
        .theme-toggle { background:var(--card-bg); border:1px solid var(--border); padding:8px 14px; border-radius:40px; cursor:pointer; font-size:18px; color:var(--text); }

        .contact-hero { text-align:center; padding:80px 0 40px; }
        .contact-hero h1 { font-size:52px; font-weight:800; font-family:"Space Grotesk",sans-serif; }
        .contact-hero h1 span { color:var(--primary); }

        .contact-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 60px; padding:40px 0 80px;
        }
        .contact-form input, .contact-form textarea {
            width:100%; padding:14px; border-radius:12px;
            border:1px solid var(--border); background:var(--bg); color:var(--text);
            margin-bottom:16px; font-family:inherit;
        }
        .contact-form button { background:var(--primary); color:#fff; border:none; padding:14px 32px; border-radius:40px; font-weight:600; cursor:pointer; transition:0.3s; }
        .contact-form button:hover { transform:scale(1.02); }
        .contact-info i { color:var(--primary); margin-right:10px; }
        .contact-info .social-links { margin-top:24px; }
        .contact-info .social-links a { font-size:24px; margin-right:16px; color:var(--text); transition:0.2s; }
        .contact-info .social-links a:hover { color:var(--primary); transform:translateY(-3px); }

        footer { padding:40px 0; text-align:center; color:#94a3b8; border-top:1px solid var(--border); margin-top:40px; }
        .socials { display:flex; justify-content:center; gap:20px; margin-bottom:16px; }
        .socials a { color:var(--text); font-size:20px; transition:0.2s; }
        .socials a:hover { color:var(--primary); transform:translateY(-3px); }

        @media (max-width:768px) { .contact-grid { grid-template-columns:1fr; } .nav { display:none; } .contact-hero h1 { font-size:36px; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">BrandName</div>
            <div class="nav">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="blog.html">Blog</a>
                <a href="contact.html" class="btn-primary">Contact</a>
            </div>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </header>
    </div>

    <div class="container">
        <section class="contact-hero">
            <h1>Let's <span>Connect</span></h1>
            <p style="color:#64748b;">We'd love to hear from you. Reach out anytime.</p>
        </section>
        <div class="contact-grid">
            <div class="contact-form">
                <form>
                    <input type="text" placeholder="Your Name" required />
                    <input type="email" placeholder="Your Email" required />
                    <input type="text" placeholder="Subject" />
                    <textarea rows="5" placeholder="Your Message"></textarea>
                    <button type="submit">Send Message →</button>
                </form>
            </div>
            <div class="contact-info">
                <h3>📍 Reach Us</h3>
                <p><i class="fas fa-envelope"></i> hello@brandname.com</p>
                <p><i class="fas fa-phone"></i> +91 99999 99999</p>
                <p><i class="fas fa-map-marker-alt"></i> Mumbai, India</p>
                <div class="social-links">
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-x-twitter"></i></a>
                    <a href="#"><i class="fab fa-youtube"></i></a>
                    <a href="#"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="socials">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-x-twitter"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
        </div>
        <p>© 2026 BrandName. All rights reserved.</p>
    </footer>

    <script>
        const toggle = document.getElementById('themeToggle');
        toggle.addEventListener('click', () => {
            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                toggle.textContent = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                toggle.textContent = '☀️';
            }
        });
    </script>
</body>
</html>
